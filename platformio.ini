; NodeMCU 一类 ESP8266（ESP-12E，4MB）+ 2.4 寸 ST7789V
; 引脚与接线见 开发流程.md。改屏幕接线时改下面的 TFT_*。

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
extra_scripts = pre:scripts/gen_config.py
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time, send_on_enter
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=4
    -D TFT_DC=5
    -D TFT_RST=16
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
